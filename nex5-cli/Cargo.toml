[package]
name = "nex5-cli"
version = "1.2.0"
edition = "2021"
rust-version = "1.74"
description = "Command-line tool for nex5file, NWB conversion, and analysis"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NeuroExplorer/nex5file"
documentation = "https://docs.rs/nex5-cli"
keywords = ["NeuroExplorer", "nex5", "cli", "neuroscience", "electrophysiology"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "nex5"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
nex5-analyze = { version = "1.2.0", path = "../nex5-analyze" }
nex5-nwb = { version = "1.2.0", path = "../nex5-nwb" }
nex5-sort = { version = "1.2.0", path = "../nex5-sort" }
nex5file = { version = "1.2.0", path = ".." }

[features]
default = []
