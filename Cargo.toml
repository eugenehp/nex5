[workspace]
members = [".", "nex5", "nex5-nwb", "nex5-analyze", "nex5-cli", "nex5-med64", "nex5-sort"]
resolver = "2"

[package]
name = "nex5file"
version = "1.2.1"
edition = "2021"
rust-version = "1.74"
description = "Read and write NeuroExplorer .nex and .nex5 files"
license = "MIT"
keywords = ["NeuroExplorer", "nex", "nex5", "neuroscience", "electrophysiology"]
categories = ["science", "parser-implementations"]
readme = "README.md"
repository = "https://github.com/eugenehp/nex5"
documentation = "https://docs.rs/nex5file"
exclude = [
    "/target",
    "/.github",
    "/nex5",
    "/nex5file-py",
    "/nex5-nwb",
    "/nex5-analyze",
    "/nex5-cli",
    "/nex5-med64",
    "/nex5-sort",
]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]
no_std = []
async = ["std", "dep:tokio"]
mmap = ["std", "dep:memmap2"]
parallel = ["std", "dep:rayon"]
# All optional performance features
full = ["async", "mmap", "parallel"]

[dependencies]
hashbrown = { version = "0.15", default-features = false, features = ["alloc", "default"] }
libm = "0.2"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha1 = { version = "0.10", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", optional = true, features = ["fs", "io-util", "rt", "macros", "rt-multi-thread"] }
memmap2 = { version = "0.9", optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
approx = "0.5"
tempfile = "3.14"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "roundtrip"
harness = false
required-features = ["std"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["std"]

[[test]]
name = "no_std"
path = "tests/no_std.rs"
required-features = []

[[test]]
name = "features"
path = "tests/features.rs"
required-features = ["std"]

[[test]]
name = "extended"
path = "tests/extended.rs"
required-features = ["std"]

[[example]]
name = "read_headers"
path = "examples/read_headers.rs"
required-features = ["std"]

[[example]]
name = "convert_to_nex"
path = "examples/convert_to_nex.rs"
required-features = ["std"]

[[example]]
name = "extract_spikes"
path = "examples/extract_spikes.rs"
required-features = ["std"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("std", "no_std", "async", "mmap", "parallel", "full"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
redundant_closure = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
field_reassign_with_default = "allow"
comparison_chain = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
