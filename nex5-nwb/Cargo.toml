[package]
name = "nex5-nwb"
version = "1.2.1"
edition = "2021"
rust-version = "1.74"
description = "Convert between NeuroExplorer .nex/.nex5 and NWB 2.x files"
license = "MIT"
keywords = ["NWB", "NeuroExplorer", "nex5", "neuroscience", "electrophysiology"]
categories = ["science"]
readme = "README.md"
repository = "https://github.com/eugenehp/nex5"
documentation = "https://docs.rs/nex5-nwb"

[dependencies]
consus-core = "0.1"
consus-nwb = "0.1"
nex5file = { version = "1.2.1", path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"
